<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06131e" />
      <stop offset="100%" stop-color="#0f293a" />
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad4)" />

  <!-- Ambient light -->
  <circle cx="300" cy="190" r="140" fill="url(#phoneGlow)" />

  <!-- Center Mobile Phone Mockup 1 (Primary) -->
  <g transform="translate(210, 25)">
    <!-- Phone Body -->
    <rect width="180" height="330" rx="28" fill="#090d16" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="62" y="10" width="56" height="14" rx="7" fill="#000000" />
    <!-- Screen content -->
    <g transform="translate(14, 34)">
      <!-- App Header -->
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="10">Selamat Pagi,</text>
      <text x="0" y="32" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Aura Pratama 👋</text>
      <circle cx="140" cy="22" r="12" fill="#14b8a6" />

      <!-- Circular Activity Ring -->
      <g transform="translate(10, 52)">
        <rect width="132" height="96" rx="14" fill="#132337" />
        <circle cx="48" cy="48" r="32" fill="none" stroke="#1e3a5f" stroke-width="8" />
        <circle cx="48" cy="48" r="32" fill="none" stroke="#14b8a6" stroke-width="8" stroke-dasharray="160" stroke-dashoffset="40" stroke-linecap="round" />
        <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">78%</text>
        <text x="92" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Target Harian</text>
        <text x="92" y="58" fill="#14b8a6" font-family="sans-serif" font-size="12" font-weight="700">8,420</text>
        <text x="92" y="70" fill="#64748b" font-family="sans-serif" font-size="8">Langkah</text>
      </g>

      <!-- Task / Workout list -->
      <g transform="translate(0, 162)">
        <text x="4" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Aktivitas Hari Ini</text>
        
        <rect x="0" y="10" width="152" height="38" rx="10" fill="#132337" />
        <circle cx="18" cy="29" r="8" fill="#10b981" fill-opacity="0.2" />
        <text x="18" y="32" fill="#10b981" font-size="9" text-anchor="middle">✓</text>
        <text x="34" y="24" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Morning Run 5K</text>
        <text x="34" y="36" fill="#64748b" font-family="sans-serif" font-size="8">32 Min • 340 Kcal</text>

        <rect x="0" y="54" width="152" height="38" rx="10" fill="#132337" />
        <circle cx="18" cy="73" r="8" fill="#06b6d4" fill-opacity="0.2" />
        <text x="18" y="76" fill="#06b6d4" font-size="9" text-anchor="middle">💧</text>
        <text x="34" y="68" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Hidrasi Air 2.5L</text>
        <text x="34" y="80" fill="#64748b" font-family="sans-serif" font-size="8">Progress: 1.8L</text>
      </g>
    </g>
  </g>

  <!-- Left Side Floating Card -->
  <g transform="translate(30, 100)">
    <rect width="150" height="90" rx="12" fill="#0f2233" stroke="#1e3a5f" stroke-width="1" />
    <text x="14" y="26" fill="#14b8a6" font-family="sans-serif" font-size="10" font-weight="700">MOBILE APP</text>
    <text x="14" y="46" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">ZenPulse Health</text>
    <text x="14" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10">Cross-Platform Flutter &amp; React Native</text>
  </g>

  <!-- Right Side Floating Metric -->
  <g transform="translate(420, 190)">
    <rect width="150" height="80" rx="12" fill="#0f2233" stroke="#1e3a5f" stroke-width="1" />
    <text x="14" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10">App Store Rating</text>
    <text x="14" y="52" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700">4.9 ★★★★★</text>
    <text x="14" y="68" fill="#64748b" font-family="sans-serif" font-size="9">50k+ Active Users</text>
  </g>
</svg>
