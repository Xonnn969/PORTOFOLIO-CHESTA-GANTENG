<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="feBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="feCodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="feShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#feBgGrad)" filter="url(#feShadow)"/>

  <!-- Subtle Inner Specular Light -->
  <rect x="11" y="11" width="98" height="98" rx="25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Mini Browser / Code Editor Canvas -->
  <rect x="22" y="24" width="76" height="72" rx="14" fill="#0B1120" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Window Control Dots -->
  <circle cx="33" cy="35" r="3" fill="#EF4444"/>
  <circle cx="42" cy="35" r="3" fill="#F59E0B"/>
  <circle cx="51" cy="35" r="3" fill="#10B981"/>

  <!-- Window Header Separator -->
  <line x1="22" y1="44" x2="98" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Frontend Code Brackets: < / > -->
  <!-- Left Bracket < -->
  <path d="M43 54 L33 66 L43 78" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Slash / -->
  <line x1="63" y1="51" x2="57" y2="81" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Right Bracket > -->
  <path d="M77 54 L87 66 L77 78" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
