<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="100%" stop-color="#0e1326" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glowBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad3)" />

  <!-- App Header -->
  <rect width="600" height="42" fill="#0f172a" rx="16" />
  <rect y="26" width="600" height="16" fill="#0f172a" />
  <circle cx="26" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="62" cy="21" r="5.5" fill="#10b981" />
  
  <text x="90" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">⚡ Synapse AI Studio</text>
  <rect x="235" y="11" width="130" height="20" rx="6" fill="#1e293b" />
  <text x="250" y="25" fill="#38bdf8" font-family="sans-serif" font-size="10">Claude-3.7 &amp; DALL-E</text>

  <!-- Left Sidebar (Flow Nodes) -->
  <g transform="translate(24, 60)">
    <rect width="160" height="295" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PROMPT PIPELINES</text>

    <!-- Node 1 -->
    <rect x="12" y="38" width="136" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="28" cy="60" r="7" fill="#6366f1" />
    <text x="44" y="55" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Input Prompt</text>
    <text x="44" y="68" fill="#a5b4fc" font-family="sans-serif" font-size="9">System Context</text>

    <!-- Node Connector Line -->
    <line x1="80" y1="82" x2="80" y2="100" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 2 -->
    <rect x="12" y="100" width="136" height="44" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
    <circle cx="28" cy="122" r="7" fill="#a855f7" />
    <text x="44" y="117" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Embedding Agent</text>
    <text x="44" y="130" fill="#d8b4fe" font-family="sans-serif" font-size="9">Vector Indexing</text>

    <!-- Node Connector Line -->
    <line x1="80" y1="144" x2="80" y2="162" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 3 -->
    <rect x="12" y="162" width="136" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="184" r="7" fill="#10b981" />
    <text x="44" y="179" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Output Stream</text>
    <text x="44" y="192" fill="#94a3b8" font-family="sans-serif" font-size="9">Markdown &amp; JSON</text>
  </g>

  <!-- Main Center Canvas -->
  <g transform="translate(196, 60)">
    <rect width="380" height="295" rx="12" fill="#0b0f19" stroke="url(#glassBorder)" stroke-width="1" />
    
    <!-- Aura -->
    <circle cx="190" cy="120" r="100" fill="url(#purpleGlow)" filter="blur(20px)" />

    <!-- Terminal Prompt Window -->
    <g transform="translate(16, 18)">
      <rect width="348" height="110" rx="10" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-family="monospace" font-size="11">$ synapse generate --model ultra-v2</text>
      <text x="14" y="46" fill="#e2e8f0" font-family="monospace" font-size="11">&gt; Analyzing multimodal dataset tokens...</text>
      <text x="14" y="68" fill="#10b981" font-family="monospace" font-size="11">✓ Vector query match: 99.4% confidence</text>
      <text x="14" y="90" fill="#a855f7" font-family="monospace" font-size="11">&gt; Rendering 3D interactive wireframe [Done]</text>
    </g>

    <!-- Bottom Action & AI Preview Cards -->
    <g transform="translate(16, 142)">
      <!-- Card A -->
      <rect width="166" height="135" rx="8" fill="#182238" stroke="#334155" stroke-width="1" />
      <rect x="10" y="10" width="146" height="70" rx="6" fill="#0f172a" />
      <circle cx="83" cy="45" r="22" fill="#6366f1" fill-opacity="0.3" />
      <polygon points="83,28 97,55 69,55" fill="#38bdf8" />
      <text x="12" y="98" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Neural Visualizer</text>
      <text x="12" y="112" fill="#64748b" font-family="sans-serif" font-size="9">Real-time weights graph</text>

      <!-- Card B -->
      <g transform="translate(182, 0)">
        <rect width="166" height="135" rx="8" fill="#182238" stroke="#334155" stroke-width="1" />
        <rect x="10" y="10" width="146" height="70" rx="6" fill="#0f172a" />
        <path d="M 25 50 Q 55 25 83 45 T 140 30" fill="none" stroke="#d946ef" stroke-width="2.5" />
        <circle cx="83" cy="45" r="4" fill="#38bdf8" />
        <text x="12" y="98" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Model Inference</text>
        <text x="12" y="112" fill="#64748b" font-family="sans-serif" font-size="9">Latency: 14ms (Edge)</text>
      </g>
    </g>
  </g>
</svg>
