<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tuRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1E28"/>
      <stop offset="100%" stop-color="#B6252A"/>
    </linearGradient>
    <linearGradient id="tuSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Badge -->
  <path d="M60 6 C85 6, 106 14, 106 42 C106 82, 60 114, 60 114 C60 114, 14 82, 14 42 C14 14, 35 6, 60 6 Z" 
        fill="url(#tuRedGrad)" filter="url(#shadow)"/>
  
