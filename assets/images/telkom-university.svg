        fill="#FFFFFF"/>

  <!-- Central Flame Core -->
  <path d="M60 22 C64 30, 68 38, 68 46 C68 56, 62 66, 60 76 C58 66, 52 56, 52 46 C52 38, 56 30, 60 22 Z" 
