<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba86e" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="avatarCircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8faff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="200" cy="200" r="185" fill="url(#avatarCircleBg)" stroke="url(#bgGrad)" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="200" cy="180" r="140" fill="url(#bgGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Background Decorative Grid Nodes -->
  <circle cx="70" cy="110" r="4" fill="#0284c7" opacity="0.7" />
  <circle cx="330" cy="130" r="5" fill="#7c3aed" opacity="0.7" />
  <circle cx="80" cy="290" r="4" fill="#6366f1" opacity="0.6" />
  <circle cx="320" cy="280" r="4" fill="#06b6d4" opacity="0.6" />

  <!-- Code Symbol Floating Bubbles -->
  <g transform="translate(45, 140)">
    <rect width="44" height="44" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" filter="url(#softShadow)"/>
    <text x="22" y="28" font-family="monospace" font-size="18" font-weight="bold" fill="#0284c7" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(310, 160)">
    <rect width="44" height="44" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.8" filter="url(#softShadow)"/>
    <text x="22" y="28" font-family="monospace" font-size="20" font-weight="bold" fill="#7c3aed" text-anchor="middle">{ }</text>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie / Shoulders -->
  <path d="M90 380 C90 310, 130 270, 200 270 C270 270, 310 310, 310 380 Z" fill="url(#hoodieGrad)" />
  <!-- Inner Collar -->
  <path d="M165 275 Q200 315 235 275" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />
  <!-- Hoodie Drawstrings -->
  <path d="M185 295 L185 335" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M215 295 L215 335" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="180" y="230" width="40" height="50" rx="8" fill="url(#skinGrad)" />

  <!-- Face Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Stylish Modern Hair -->
  <path d="M142 165 C140 120, 165 95, 205 95 C250 95, 262 125, 258 165 C250 140, 230 130, 200 130 C170 130, 150 145, 142 165 Z" fill="#18181b" />
  <path d="M142 165 Q135 185 145 205 Q149 175 155 170 Z" fill="#18181b" />
  <path d="M258 165 Q265 185 255 205 Q251 175 245 170 Z" fill="#18181b" />

  <!-- Glasses -->
  <rect x="155" y="165" width="38" height="26" rx="7" fill="none" stroke="#0ea5e9" stroke-width="4" />
  <rect x="207" y="165" width="38" height="26" rx="7" fill="none" stroke="#0ea5e9" stroke-width="4" />
  <line x1="193" y1="178" x2="207" y2="178" stroke="#0ea5e9" stroke-width="4" />
  <!-- Glasses glare -->
  <line x1="162" y1="171" x2="172" y2="181" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <line x1="214" y1="171" x2="224" y2="181" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="178" r="4" fill="#1e293b" />
  <circle cx="226" cy="178" r="4" fill="#1e293b" />

  <!-- Friendly Smile -->
  <path d="M185 210 Q200 224 215 210" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round" />

  <!-- Floating Star Badge -->
  <g transform="translate(180, 45)">
    <circle cx="20" cy="20" r="16" fill="#10b981" filter="url(#glow)" opacity="0.3"/>
    <circle cx="20" cy="20" r="12" fill="#10b981"/>
    <path d="M20 13 L22 17.5 L27 18 L23.5 21.5 L24.5 26.5 L20 24 L15.5 26.5 L16.5 21.5 L13 18 L18 17.5 Z" fill="#ffffff" />
  </g>
</svg>
