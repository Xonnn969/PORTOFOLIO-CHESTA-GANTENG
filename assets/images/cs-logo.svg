<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="csBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="csLetterSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="csDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle with Shadow -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#csBgGrad)" filter="url(#csDropShadow)"/>

  <!-- Subtle Specular Inner Rim -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="22.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Monogram Glyph Group CS -->
  <g id="cs-monogram">
    <!-- Letter C -->
    <path d="M 44 29 C 24 29 18 39 18 50 C 18 61 24 71 44 71" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9.5" 
          stroke-linecap="round"/>

    <!-- Letter S -->
    <path d="M 76 29.5 C 59 29.5 52 37.5 52 45.5 C 52 54 76 49.5 76 58 C 76 66 67 70.5 52 70.5" 
          fill="none" 
          stroke="url(#csLetterSGrad)" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
