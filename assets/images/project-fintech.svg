<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />
  
  <!-- Browser / App Header bar -->
  <rect width="600" height="42" fill="#131c31" rx="16" />
  <rect y="26" width="600" height="16" fill="#131c31" />
  <circle cx="26" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="62" cy="21" r="5.5" fill="#10b981" />
  <rect x="90" y="11" width="220" height="20" rx="6" fill="#1e293b" />
  <text x="105" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">app.finvault.io/dashboard</text>

  <!-- Sidebar -->
  <rect x="18" y="58" width="50" height="304" rx="12" fill="#141e33" />
  <circle cx="43" cy="80" r="14" fill="#6366f1" />
  <rect x="28" y="115" width="30" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
  <rect x="28" y="135" width="30" height="8" rx="4" fill="#475569" />
  <rect x="28" y="155" width="30" height="8" rx="4" fill="#475569" />
  <rect x="28" y="175" width="30" height="8" rx="4" fill="#475569" />

  <!-- Metric Card 1 -->
  <g transform="translate(84, 58)">
    <rect width="150" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Total Portfolio</text>
    <text x="16" y="52" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="700">$128,450.00</text>
    <rect x="16" y="60" width="46" height="14" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="21" y="71" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">+14.6% ↑</text>
  </g>

  <!-- Metric Card 2 -->
  <g transform="translate(246, 58)">
    <rect width="150" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Monthly Yield</text>
    <text x="16" y="52" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="700">$9,340.20</text>
    <rect x="16" y="60" width="46" height="14" rx="4" fill="#38bdf8" fill-opacity="0.15" />
    <text x="21" y="71" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">+4.2% ↑</text>
  </g>

  <!-- Metric Card 3 -->
  <g transform="translate(408, 58)">
    <rect width="174" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Active Assets</text>
    <text x="16" y="52" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="700">32 Tokens</text>
    <text x="16" y="70" fill="#a855f7" font-family="sans-serif" font-size="10">8 Protocols connected</text>
  </g>

  <!-- Main Chart Card -->
  <g transform="translate(84, 150)">
    <rect width="324" height="212" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="18" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Analytics Overview</text>
    
    <!-- Grid Lines -->
    <line x1="18" y1="65" x2="306" y2="65" stroke="#334155" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="18" y1="105" x2="306" y2="105" stroke="#334155" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="18" y1="145" x2="306" y2="145" stroke="#334155" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="18" y1="185" x2="306" y2="185" stroke="#334155" stroke-opacity="0.8" />

    <!-- Chart Fill & Line -->
    <path d="M 25 155 Q 70 140, 110 90 T 190 120 T 260 65 T 300 50 L 300 185 L 25 185 Z" fill="url(#chartGrad)" />
    <path d="M 25 155 Q 70 140, 110 90 T 190 120 T 260 65 T 300 50" fill="none" stroke="url(#lineGrad)" stroke-width="3" />

    <!-- Chart Active Pointer -->
    <circle cx="260" cy="65" r="5" fill="#c084fc" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Side Transactions List -->
  <g transform="translate(420, 150)">
    <rect width="162" height="212" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="14" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Recent Transactions</text>

    <!-- Item 1 -->
    <circle cx="26" cy="60" r="12" fill="#10b981" fill-opacity="0.2" />
    <text x="22" y="64" fill="#10b981" font-size="11">↓</text>
    <text x="46" y="57" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Deposit ETH</text>
    <text x="46" y="70" fill="#64748b" font-family="sans-serif" font-size="9">Today, 14:20</text>
    <text x="148" y="62" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">+$2,400</text>

    <!-- Item 2 -->
    <circle cx="26" cy="104" r="12" fill="#ef4444" fill-opacity="0.2" />
    <text x="22" y="108" fill="#ef4444" font-size="11">↑</text>
    <text x="46" y="101" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Staking Pool</text>
    <text x="46" y="114" fill="#64748b" font-family="sans-serif" font-size="9">Yesterday</text>
    <text x="148" y="106" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">-$850</text>

    <!-- Item 3 -->
    <circle cx="26" cy="148" r="12" fill="#6366f1" fill-opacity="0.2" />
    <text x="22" y="152" fill="#818cf8" font-size="11">⚡</text>
    <text x="46" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Swap USDT</text>
    <text x="46" y="158" fill="#64748b" font-family="sans-serif" font-size="9">Sep 28</text>
    <text x="148" y="150" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">$1,200</text>
  </g>
</svg>
