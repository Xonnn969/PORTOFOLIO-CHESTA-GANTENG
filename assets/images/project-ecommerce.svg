<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#182235" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad2)" />

  <!-- App Header -->
  <rect width="600" height="42" fill="#111827" rx="16" />
  <rect y="26" width="600" height="16" fill="#111827" />
  <circle cx="26" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="62" cy="21" r="5.5" fill="#10b981" />
  <text x="90" y="25" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="700">KICKZ<tspan fill="#f43f5e">.STORE</tspan></text>
  <text x="260" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">New Drops</text>
  <text x="340" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">Men</text>
  <text x="390" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">Women</text>
  <rect x="520" y="11" width="60" height="20" rx="10" fill="#1f2937" />
  <text x="542" y="25" fill="#f43f5e" font-family="sans-serif" font-size="10">Cart (3)</text>

  <!-- Product Showcase Card -->
  <g transform="translate(40, 65)">
    <!-- Big Card Container -->
    <rect width="520" height="280" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
    
    <!-- Hero Aura Behind Product -->
    <ellipse cx="180" cy="140" rx="120" ry="90" fill="url(#glowGrad)" />

    <!-- Stylized Modern Sneaker Graphic -->
    <g transform="translate(60, 60)">
      <!-- Sole Shadow -->
      <ellipse cx="120" cy="155" rx="110" ry="12" fill="#030712" opacity="0.6" />
      
      <!-- Sneaker Sole -->
      <path d="M 20 135 Q 70 145 140 145 Q 210 145 240 125 Q 242 145 210 152 Q 130 155 20 142 Z" fill="#f8fafc" />
      <!-- Air cushion bubble -->
      <rect x="55" y="142" width="40" height="7" rx="3" fill="#38bdf8" opacity="0.8" />

      <!-- Sneaker Upper Body -->
      <path d="M 30 135 L 75 75 Q 110 50 140 85 L 175 110 Q 215 110 235 125 L 20 135 Z" fill="url(#shoeGrad)" />
      
      <!-- Accents & Swoosh/Slash -->
      <path d="M 85 85 Q 140 115 195 105" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <path d="M 80 100 Q 130 120 180 115" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
      
      <!-- Laces -->
      <line x1="110" y1="75" x2="125" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="120" y1="85" x2="135" y2="95" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="130" y1="95" x2="145" y2="105" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Product Details Right Column -->
    <g transform="translate(290, 30)">
      <!-- Badge -->
      <rect width="84" height="20" rx="10" fill="#f43f5e" fill-opacity="0.15" />
      <text x="12" y="14" fill="#fb7185" font-family="sans-serif" font-size="10" font-weight="700">LIMITED EDITION</text>

      <text x="0" y="55" fill="#f9fafb" font-family="sans-serif" font-size="22" font-weight="800">AeroPulse Stealth X</text>
      <text x="0" y="78" fill="#9ca3af" font-family="sans-serif" font-size="12">Next-generation ultralight responsive running shoe with carbon fiber plate.</text>

      <!-- Rating -->
      <text x="0" y="105" fill="#f59e0b" font-size="12">★★★★★</text>
      <text x="65" y="105" fill="#9ca3af" font-family="sans-serif" font-size="11">(4.9/5 from 1,240 reviews)</text>

      <!-- Size Selector -->
      <text x="0" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Select Size (EU):</text>
      <g transform="translate(0, 145)">
        <rect x="0" width="34" height="30" rx="8" fill="#1f2937" stroke="#374151" />
        <text x="17" y="20" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">41</text>

        <rect x="42" width="34" height="30" rx="8" fill="#f43f5e" />
        <text x="59" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">42</text>

        <rect x="84" width="34" height="30" rx="8" fill="#1f2937" stroke="#374151" />
        <text x="101" y="20" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">43</text>

        <rect x="126" width="34" height="30" rx="8" fill="#1f2937" stroke="#374151" />
        <text x="143" y="20" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">44</text>
      </g>

      <!-- Price & CTA -->
      <g transform="translate(0, 205)">
        <text x="0" y="18" fill="#9ca3af" font-family="sans-serif" font-size="11">Price</text>
        <text x="0" y="38" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="800">$189.00</text>
        <text x="82" y="36" fill="#6b7280" font-family="sans-serif" font-size="12" text-decoration="line-through">$249</text>

        <rect x="125" y="8" width="95" height="36" rx="18" fill="url(#btnGrad)" />
        <text x="172" y="31" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Add to Bag 🛍</text>
      </g>
    </g>
  </g>
</svg>
